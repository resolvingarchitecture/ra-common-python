[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ra-common"
version = "0.1.0"
description = "Resolving Architecture - Common - Python. Core messaging, identity, crypto and content types for the RA / 1M5 ecosystem."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Brian Taylor", email = "brian@resolvingarchitecture.io" }]
keywords = ["messaging", "envelope", "identity", "did", "crypto"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://resolvingarchitecture.io"
Repository = "https://github.com/resolvingarchitecture/ra-common-python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ra_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
